config_name: "bf16_baseline"
# BF16, not FP16: Qwen3-8B ships bfloat16 weights and vLLM loads them
# natively (server log shows dtype=torch.bfloat16). Forcing --dtype float16
# would narrow exponent range on a model never trained for it, degrading the
# very reference point every other arm is measured against.
quant_scheme: "BF16"
# launch:
#   VLLM_ATTENTION_BACKEND=FLASH_ATTN VLLM_USE_DEEP_GEMM=0 \
#   vllm serve /mnt/nvme4tb/llm_models/qwen/Qwen3-8B \
#     --gpu-memory-utilization 0.85 --max-model-len 12288 \
#     --port 8000 --served-model-name model-under-test \
#     --reasoning-parser qwen3
#   (--reasoning-parser is REQUIRED for the APEX pass: without it,
#    Qwen3 <think> blocks reach APEX's scorers and destroy programmatic
#    scoring. Pair it with no_think: true in the APEX model entry.
#    See LANDMINES.md. It does not affect throughput -- the serving
#    bench uses /v1/completions with ignore_eos.)
# Measured on this box: weights 15.26 GiB, leaving ~10.8 GiB of KV cache.
model: "Qwen3-8B"
checkpoint: "/mnt/nvme4tb/llm_models/qwen/Qwen3-8B"
base_url: "http://127.0.0.1:8000"
served_model_name: "model-under-test"
max_tokens: 256
n_requests: 200
concurrency_levels: [1, 4, 16, 64]
warmup_requests: 8
throughput_temperature: 0.0
# CONTROL: every request decodes exactly max_tokens. Without this each scheme
# stops at its own EOS and the arms do unequal decode work. See
# run_serving_bench.py::one_request.
ignore_eos: true
input_profile: "512in_256out_var64"
prompt_file: "data/prompts_512in.txt"
quality: {task_file: "data/tasks.jsonl", corpus_file: "data/heldout_corpus.txt", max_tokens: 32}
# APEX model_id for THIS arm: pass 1 must run APEX with a model entry
# named exactly this, so the importer can pick out its rows.
apex: {model_id: "qwen3-8b-bf16"}
notes: "Reference point. All retention/throughput deltas are relative to this."

# --- telemetry sampling (controlled) ---
power_sample_interval_s: 0.25   # background nvidia-smi poll during measured interval
gpu_index: 0                    # index WITHIN CUDA_VISIBLE_DEVICES (pinned to one GPU)
