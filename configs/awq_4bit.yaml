config_name: "awq_4bit"
quant_scheme: "AWQ-4bit"
# AWQ 4-bit is the documented fix for Blackwell garbage-character output and is
# the aggressive-throughput end of the sweep.
# launch (quantization is auto-detected from the checkpoint config):
#   VLLM_ATTENTION_BACKEND=FLASH_ATTN \
#   vllm serve /mnt/nvme4tb/llm_models/qwen/Qwen3-8B-AWQ \
#     --gpu-memory-utilization 0.85 --max-model-len 8192 \
#     --port 8000 --served-model-name model-under-test
# VERIFIED on this box: vLLM 0.27.1 selects auto_awq -> MarlinLinearKernel,
# 18.28 GiB KV cache (133,104 tokens).
model: "Qwen3-8B"
checkpoint: "/mnt/nvme4tb/llm_models/qwen/Qwen3-8B-AWQ"
base_url: "http://127.0.0.1:8000"
served_model_name: "model-under-test"
max_tokens: 256
n_requests: 200
concurrency_levels: [1, 4, 16, 64]
warmup_requests: 8
throughput_temperature: 0.0
input_profile: "512in_256out_var64"
prompt_file: "data/prompts_512in.txt"
quality: {task_file: "data/tasks.jsonl", corpus_file: "data/heldout_corpus.txt", max_tokens: 32}
apex: {probe_set: "default", repeats: 5}
notes: "AWQ weights must derive from the same base checkpoint as FP16/FP8 to keep the comparison honest."

# --- telemetry sampling (controlled) ---
power_sample_interval_s: 0.25   # background nvidia-smi poll during measured interval
gpu_index: 0                    # index WITHIN CUDA_VISIBLE_DEVICES (pinned to one GPU)
