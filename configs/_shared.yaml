# Values shared across all scheme configs. Copy the relevant keys into each
# scheme file, or load-and-merge in your runner. Kept here as the single source
# of truth for the CONTROLLED variables -- these must be identical across every
# scheme, because the only thing allowed to vary within a comparison is the
# quantization scheme.

# ONE model, three checkpoints. `model` is the identity held constant across
# every arm; `checkpoint` is the per-scheme weight directory (set in each
# scheme file). Qwen3-8B is dense 8B: all three arms fit one 32 GiB 5090 with
# KV headroom, which a 30B+ MoE does not (FP16 alone needs ~65 GiB).
model: "Qwen3-8B"
base_url: "http://127.0.0.1:8000"
served_model_name: "model-under-test"

# --- controlled: identical across all schemes ---
max_model_len: 8192
# Attention backend is a CONTROLLED variable, so PIN it rather than letting
# vLLM auto-select. On this stack vLLM chose FLASH_ATTN from
# [FLASH_ATTN, FLASHINFER, TRITON_ATTN, FLEX_ATTENTION]; a different arm could
# silently get a different backend and break the comparison.
# Export before launching:  VLLM_ATTENTION_BACKEND=FLASH_ATTN
attention_backend: "FLASH_ATTN"
# DeepGEMM must be OFF: its scale-factor layout transform crashes on sm_120
# when loading block-scaled FP8 weights ("Unknown SF transformation"). With it
# disabled vLLM selects the native CutlassFp8BlockScaledMMKernel. Set for EVERY
# arm so the environment is identical -- it is a no-op for FP16 and AWQ.
# Export before launching:  VLLM_USE_DEEP_GEMM=0
use_deep_gemm: false
gpu_memory_utilization: 0.85
max_tokens: 256
n_requests: 200
concurrency_levels: [1, 4, 16, 64]
warmup_requests: 8
throughput_temperature: 0.0
# CONTROL: every request decodes exactly max_tokens. Without this each scheme
# stops at its own EOS and the arms do unequal decode work. See
# run_serving_bench.py::one_request.
ignore_eos: true

# fixed, DECLARED input-length distribution
input_profile: "512in_256out_var64"   # document how prompt_file was generated
prompt_file: "data/prompts_512in.txt"

quality:
  task_file: "data/tasks.jsonl"        # {"prompt":..,"answer":..} per line
  corpus_file: "data/heldout_corpus.txt"
  max_tokens: 32

apex:
  # passthrough to your APEX characterization run (dimensions, probe sets, etc.)
  probe_set: "default"
  repeats: 5

# --- telemetry sampling (controlled) ---
power_sample_interval_s: 0.25   # background nvidia-smi poll during measured interval
gpu_index: 0                    # index WITHIN CUDA_VISIBLE_DEVICES (pinned to one GPU)
