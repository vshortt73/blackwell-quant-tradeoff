# Values shared across all scheme configs. Copy the relevant keys into each
# scheme file, or load-and-merge in your runner. Kept here as the single source
# of truth for the CONTROLLED variables -- these must be identical across every
# scheme, because the only thing allowed to vary within a comparison is the
# quantization scheme.

model: "Qwen3.6-35B-A3B"          # one model FAMILY for the core result
base_url: "http://127.0.0.1:8000"
served_model_name: "model-under-test"

# --- controlled: identical across all schemes ---
max_model_len: 8192
gpu_memory_utilization: 0.85
max_tokens: 256
n_requests: 200
concurrency_levels: [1, 4, 16, 64]
warmup_requests: 8
throughput_temperature: 0.0

# fixed, DECLARED input-length distribution
input_profile: "512in_256out_var64"   # document how prompt_file was generated
prompt_file: "data/prompts_512in.txt"

quality:
  task_file: "data/tasks.jsonl"        # {"prompt":..,"answer":..} per line
  corpus_file: "data/heldout_corpus.txt"
  max_tokens: 32

apex:
  # passthrough to your APEX characterization run (dimensions, probe sets, etc.)
  probe_set: "default"
  repeats: 5

# --- telemetry sampling (controlled) ---
power_sample_interval_s: 0.25   # background nvidia-smi poll during measured interval
gpu_index: 0                    # index WITHIN CUDA_VISIBLE_DEVICES (pinned to one GPU)
