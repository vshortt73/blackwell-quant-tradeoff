# Values shared across all scheme configs. Copy the relevant keys into each
# scheme file, or load-and-merge in your runner. Kept here as the single source
# of truth for the CONTROLLED variables -- these must be identical across every
# scheme, because the only thing allowed to vary within a comparison is the
# quantization scheme.

# ONE model, three checkpoints. `model` is the identity held constant across
# every arm; `checkpoint` is the per-scheme weight directory (set in each
# scheme file). Qwen3-8B is dense 8B: all three arms fit one 32 GiB 5090 with
# KV headroom, which a 30B+ MoE does not (BF16 alone needs ~65 GiB).
model: "Qwen3-8B"
base_url: "http://127.0.0.1:8000"
served_model_name: "model-under-test"

# --- controlled: identical across all schemes ---
# 12288, not 8192: APEX targets 8192-TOKEN CONTEXTS, and an 8192-token prompt
# in an 8192-token window leaves no room to generate. The window must exceed the
# largest probe context plus max_tokens. Identical across arms, so it is
# controlled; it does not change total KV memory (that is set by
# gpu_memory_utilization), only the longest permitted sequence.
max_model_len: 12288
# Attention backend is a CONTROLLED variable, so PIN it rather than letting
# vLLM auto-select. On this stack vLLM chose FLASH_ATTN from
# [FLASH_ATTN, FLASHINFER, TRITON_ATTN, FLEX_ATTENTION]; a different arm could
# silently get a different backend and break the comparison.
# Export before launching:  VLLM_ATTENTION_BACKEND=FLASH_ATTN
attention_backend: "FLASH_ATTN"
# DeepGEMM must be OFF: its scale-factor layout transform crashes on sm_120
# when loading block-scaled FP8 weights ("Unknown SF transformation"). With it
# disabled vLLM selects the native CutlassFp8BlockScaledMMKernel. Set for EVERY
# arm so the environment is identical -- it is a no-op for BF16 and AWQ.
# Export before launching:  VLLM_USE_DEEP_GEMM=0
use_deep_gemm: false
gpu_memory_utilization: 0.85
max_tokens: 256
n_requests: 200
concurrency_levels: [1, 4, 16, 64]
warmup_requests: 8
throughput_temperature: 0.0
# CONTROL: every request decodes exactly max_tokens. Without this each scheme
# stops at its own EOS and the arms do unequal decode work. See
# run_serving_bench.py::one_request.
ignore_eos: true

# fixed, DECLARED input-length distribution
input_profile: "512in_256out_var64"   # document how prompt_file was generated
prompt_file: "data/prompts_512in.txt"

quality:
  task_file: "data/tasks.jsonl"        # {"prompt":..,"answer":..} per line
  corpus_file: "data/heldout_corpus.txt"
  max_tokens: 32
  # Few-shot prefix prepended to every task prompt. NOT optional polish: these
  # hit /v1/completions with no chat template, and bare stems make the model
  # emit worksheets ("____ A. Glucagon B. Insulin"), ask questions back
  # ("what? Also, ..."), or repeat the prompt. That scores prompt format rather
  # than model knowledge. Measured: 7 of 11 baseline failures were format
  # artifacts, and all 7 pass with this prefix.
  #
  # CONTROLLED: identical across every arm; its hash is recorded in each
  # result. Exemplars deliberately share no answer with the task set.
  few_shot: |
    Complete each statement with the answer only.

    The capital of Japan is Tokyo.
    The chemical symbol for oxygen is O.
    The largest planet in the solar system is Jupiter.


apex:
  # TWO-PASS. Pass 1 runs APEX NATIVELY with its own config -- it already
  # supports several models in one run and records `quantization` per row, so a
  # single `apex run` can cover every arm:
  #     apex run <your-apex-config>.yaml
  # Pass 2 imports what it produced, once per scheme:
  #     python harness/run_apex_eval.py configs/awq_4bit.yaml
  #
  # The two passes stay separate because their disciplines conflict: APEX
  # parallelises for speed, whereas concurrency IS the independent variable in
  # the serving benchmark, and timing measurement demands an exclusive GPU.
  #
  # source: APEX results database, or an `apex export <dsn> -o rows.json` file
  # (the latter works regardless of whether APEX is on SQLite or PostgreSQL).
  source: "/opt/apex/results.db"
  # model_id is set PER SCHEME -- one APEX database may hold all three arms.
  #
  # PASS 1 REQUIREMENTS (set these in the APEX config, not here):
  #
  #  a) EVALUATOR MODEL. Salience probes and 15 of 20 application probes are
  #     rubric-scored. Without an evaluator they run but store NULL scores,
  #     losing salience entirely. It must not be the model under test -- a
  #     quantized judge degrades in lockstep with its subject. Established
  #     setup here is llama-server on node2:
  #         evaluator_models:
  #           - name: <label>
  #             backend: llamacpp
  #             base_url: http://node2:8080
  #     Verify and fingerprint it before and after the sweep:
  #         python harness/check_evaluator.py --base-url http://node2:8080
  #     A changed fingerprint means the judge moved mid-sweep and the
  #     rubric-scored dimensions are no longer comparable across arms.
  #
  #  b) no_think: true on the model entry, AND --reasoning-parser qwen3 on the
  #     vLLM launch. Neither alone is sufficient: with the parser alone the
  #     model reasons until the token budget is gone and `content` is empty;
  #     with /no_think alone the empty <think></think> prefix remains and
  #     breaks starts_with/format_check. Measured impact of getting this wrong:
  #     programmatic scores 0.332 vs 0.983 for exact_match. See LANDMINES.md.
  #
  # Curve-existence detection (harness/apex_curve.py). APEX does NOT report
  # curve_exists/curve_strength; they are derived from its per-position scores
  # by a seeded permutation test on eta-squared, so verdicts reproduce.
  n_perm: 10000
  alpha: 0.05
  curve_seed: 20260819
  # Probe subset for pass 1, from harness/check_probes.py against BF16.
  # 28 of 60 seed probes are usable on Qwen3-8B: 14 factual probes sit at
  # ceiling, 14 salience probes at floor. Running the excluded 32 costs hours
  # and cannot register a result. Re-derive per model -- difficulty is relative
  # to the model under test.
  probes_usable_qwen3_8b:
    - I-001
    - I-002
    - I-005
    - I-006
    - I-007
    - I-008
    - I-009
    - I-010
    - I-012
    - I-013
    - I-014
    - I-015
    - I-016
    - I-017
    - I-018
    - I-020
    - F-008
    - F-009
    - F-013
    - F-014
    - F-015
    - F-019
    - S-005
    - S-008
    - S-010
    - S-014
    - S-017
    - S-018

# --- telemetry sampling (controlled) ---
power_sample_interval_s: 0.25   # background nvidia-smi poll during measured interval
gpu_index: 0                    # index WITHIN CUDA_VISIBLE_DEVICES (pinned to one GPU)
